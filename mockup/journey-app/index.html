<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="MVP della web app percorso cliente BraveVETBusiness sui dati reali di tre clienti: Antonio Viglietti, Enrico Di Blasi e Stefania Zanini. Console BVB e dashboard cliente.">
<style>html{color-scheme:light dark}body{margin:0;font:14px/1.5 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>BraveVET Journey</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..800&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#f7f5ef; --bg-sunk:#efece3;
    --surface:#ffffff; --surface-2:#fbf9f4;
    --ink:#12151a; --ink-2:#2b3038; --mute:#63666d;
    --rule:rgba(18,21,26,.11); --rule-2:rgba(18,21,26,.2);
    --teal:#1f6b68; --teal-deep:#0e4541; --teal-soft:rgba(31,107,104,.1);
    --gold:#a8781d; --gold-soft:rgba(217,164,65,.18);
    --coral:#c9452f; --coral-soft:rgba(234,88,68,.14);
    --on-teal:#f7f5ef;
    --shadow:0 1px 2px rgba(18,21,26,.05),0 8px 24px -16px rgba(18,21,26,.28);
    --radius:10px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1216; --bg-sunk:#0b0e11;
      --surface:#171b21; --surface-2:#1c2128;
      --ink:#ece8de; --ink-2:#cfcabe; --mute:#94989f;
      --rule:rgba(236,232,222,.13); --rule-2:rgba(236,232,222,.24);
      --teal:#5bafa9; --teal-deep:#8fd0ca; --teal-soft:rgba(91,175,169,.15);
      --on-teal:#0f1216;
      --gold:#e0b569; --gold-soft:rgba(224,181,105,.16);
      --coral:#f0806c; --coral-soft:rgba(240,128,108,.16);
      --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -18px rgba(0,0,0,.8);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1216; --bg-sunk:#0b0e11;
    --surface:#171b21; --surface-2:#1c2128;
    --ink:#ece8de; --ink-2:#cfcabe; --mute:#94989f;
    --rule:rgba(236,232,222,.13); --rule-2:rgba(236,232,222,.24);
    --teal:#5bafa9; --teal-deep:#8fd0ca; --teal-soft:rgba(91,175,169,.15);
      --on-teal:#0f1216;
    --gold:#e0b569; --gold-soft:rgba(224,181,105,.16);
    --coral:#f0806c; --coral-soft:rgba(240,128,108,.16);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -18px rgba(0,0,0,.8);
  }

  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:"Manrope",system-ui,-apple-system,sans-serif;
    font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{margin:0;text-wrap:balance}
  button{font:inherit;color:inherit;cursor:pointer}
  .serif{font-family:"Fraunces",Georgia,serif;font-weight:600;letter-spacing:-.01em}
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
  .label{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);
  }
  .num{font-variant-numeric:tabular-nums}
  :focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:4px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* ---------- shell ---------- */
  .shell{max-width:1280px;margin:0 auto;padding:0 22px 64px}
  .topbar{
    position:sticky;top:0;z-index:40;background:var(--bg);
    border-bottom:1px solid var(--rule);
  }
  .topbar .row{
    max-width:1280px;margin:0 auto;padding:12px 22px;
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  }
  .mark{display:flex;align-items:center;gap:9px;flex:none}
  .mark .glyph{
    width:28px;height:28px;border-radius:7px;background:var(--teal-deep);
    color:var(--on-teal);display:grid;place-items:center;
    font-family:"Fraunces",serif;font-weight:700;font-size:14px;
  }
  .mark b{font-weight:700;letter-spacing:-.01em}
  .mark span{color:var(--mute);font-size:12px}

  .switch{display:flex;gap:2px;background:var(--bg-sunk);padding:3px;border-radius:8px;margin-left:auto}
  .switch button{
    border:0;background:transparent;padding:6px 12px;border-radius:6px;
    font-size:12.5px;font-weight:600;color:var(--mute);
  }
  .switch button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

  /* ---------- search ---------- */
  .searchwrap{position:relative;flex:1 1 320px;max-width:460px}
  .search{
    display:flex;align-items:center;gap:10px;background:var(--surface);
    border:1px solid var(--rule-2);border-radius:9px;padding:9px 12px;box-shadow:var(--shadow);
  }
  .search input{
    border:0;background:transparent;color:var(--ink);width:100%;font:inherit;outline:none;
  }
  .search input::placeholder{color:var(--mute)}
  .search kbd{
    font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--mute);
    border:1px solid var(--rule);border-radius:4px;padding:2px 5px;flex:none;
  }
  .results{
    position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:50;
    background:var(--surface);border:1px solid var(--rule-2);border-radius:10px;
    box-shadow:var(--shadow);overflow:hidden;
  }
  .results button{
    display:flex;width:100%;align-items:center;gap:10px;text-align:left;
    border:0;background:transparent;padding:10px 12px;border-bottom:1px solid var(--rule);
  }
  .results button:last-child{border-bottom:0}
  .results button:hover,.results button.on{background:var(--teal-soft)}
  .results .nm{font-weight:600}
  .results .meta{margin-left:auto;font-size:11.5px;color:var(--mute)}

  /* ---------- generic blocks ---------- */
  .grid{display:grid;gap:18px;align-items:start}
  .panel{
    background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);
    padding:18px;box-shadow:var(--shadow);
  }
  .panel > header{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
  .panel > header h3{font-size:13px;font-weight:700;letter-spacing:-.005em}
  .panel > header .count{margin-left:auto;color:var(--mute);font-size:12px}
  .plain{background:transparent;border:0;box-shadow:none;padding:0}

  .chip{
    display:inline-flex;align-items:center;gap:5px;border-radius:99px;
    padding:3px 9px;font-size:11px;font-weight:600;letter-spacing:.01em;
    border:1px solid transparent;white-space:nowrap;
  }
  .chip.done{background:var(--teal-soft);color:var(--teal);border-color:var(--teal-soft)}
  .chip.wip{background:var(--gold-soft);color:var(--gold)}
  .chip.late{background:var(--coral-soft);color:var(--coral)}
  .chip.idle{background:var(--bg-sunk);color:var(--mute)}
  .chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor}

  .btn{
    border:1px solid var(--rule-2);background:var(--surface);border-radius:8px;
    padding:8px 14px;font-size:12.5px;font-weight:600;
  }
  .btn:hover{border-color:var(--ink);}
  .btn.primary{background:var(--teal-deep);border-color:var(--teal-deep);color:var(--on-teal)}
  .btn.ghost{background:transparent}
  .btn.sm{padding:5px 10px;font-size:11.5px}

  /* ---------- journey track ---------- */
  .track{display:flex;gap:0;overflow-x:auto;padding:4px 0 2px}
  .step{flex:1 1 0;min-width:112px;position:relative;padding-top:26px;text-align:left}
  .step::before{
    content:"";position:absolute;top:11px;left:0;right:0;height:2px;background:var(--rule-2);
  }
  .step:first-child::before{left:11px}
  .step:last-child::before{right:calc(100% - 12px)}
  .step.done::before,.step.now::before{background:var(--teal)}
  .step .bead{
    position:absolute;top:0;left:0;width:22px;height:22px;border-radius:50%;
    background:var(--surface);border:2px solid var(--rule-2);
    display:grid;place-items:center;font-size:10.5px;font-weight:700;color:var(--mute);
  }
  .step.done .bead{background:var(--teal);border-color:var(--teal);color:var(--surface)}
  .step.now .bead{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
  .step .nm{font-size:12px;font-weight:600;padding-right:12px;display:block}
  .step .st{font-size:11px;color:var(--mute)}
  .step.now .st{color:var(--gold);font-weight:600}

  /* ---------- meters ---------- */
  .meter{height:6px;border-radius:99px;background:var(--bg-sunk);overflow:hidden}
  .meter i{display:block;height:100%;background:var(--teal);border-radius:99px}

  /* ---------- lists ---------- */
  .stack{display:flex;flex-direction:column;gap:12px}
  .row-item{display:flex;gap:12px;align-items:flex-start}
  .divide > *+*{border-top:1px solid var(--rule);padding-top:12px;margin-top:12px}

  .timeline{position:relative;padding-left:22px}
  .timeline::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--rule-2)}
  .tl-item{position:relative;padding-bottom:18px}
  .tl-item:last-child{padding-bottom:0}
  .tl-item::before{
    content:"";position:absolute;left:-21px;top:5px;width:11px;height:11px;border-radius:50%;
    background:var(--surface);border:2px solid var(--teal);
  }
  .tl-item.draft::before{border-color:var(--gold)}
  .tl-item.plan::before{border-color:var(--rule-2)}
  .tl-head{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .tl-head .t{font-weight:700;font-size:13.5px}
  .tl-meta{color:var(--mute);font-size:11.5px;margin:3px 0 8px}
  .tl-actions{display:flex;gap:8px;flex-wrap:wrap}

  .req{border:1px solid var(--rule);border-radius:9px;padding:12px;background:var(--surface-2)}
  .req .q{font-weight:600;margin:6px 0 4px}
  .req .who{font-size:11.5px;color:var(--mute)}

  .task{display:flex;gap:10px;align-items:flex-start;font-size:13px}
  .task .box{
    width:15px;height:15px;border-radius:4px;border:1.5px solid var(--rule-2);flex:none;margin-top:2px;
    display:grid;place-items:center;font-size:10px;color:var(--surface);
  }
  .task.ok .box{background:var(--teal);border-color:var(--teal)}
  .task.ok .txt{color:var(--mute);text-decoration:line-through}
  .task .due{display:block;font-size:11px;color:var(--mute)}
  .task.late .due{color:var(--coral);font-weight:600}

  .kv{display:flex;justify-content:space-between;gap:12px;font-size:13px}
  .kv .v{font-weight:600}

  .note{
    background:var(--bg-sunk);border-left:2px solid var(--rule-2);
    padding:10px 12px;border-radius:0 8px 8px 0;font-size:12.5px;color:var(--ink-2);
  }
  .banner{
    display:flex;gap:12px;align-items:center;flex-wrap:wrap;
    background:var(--teal-soft);border:1px solid var(--teal-soft);
    border-radius:var(--radius);padding:12px 16px;font-size:13px;
  }

  /* ---------- client portal ---------- */
  .portal-hero{
    background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);
    padding:22px;box-shadow:var(--shadow);border-top:3px solid var(--teal);
  }
  .portal-hero h2{font-size:clamp(22px,3.4vw,30px)}
  .next-card{
    background:linear-gradient(180deg,var(--surface-2),var(--surface));
    border:1px solid var(--rule-2);border-radius:var(--radius);padding:18px;
  }
  .next-card .when{font-family:"Fraunces",serif;font-size:22px;font-weight:600;letter-spacing:-.01em}

  /* ---------- modal ---------- */
  .overlay{
    position:fixed;inset:0;z-index:80;background:rgba(12,14,17,.5);
    display:flex;align-items:flex-start;justify-content:center;padding:5vh 18px;overflow:auto;
  }
  .sheet{
    background:var(--surface);border-radius:12px;max-width:720px;width:100%;
    border:1px solid var(--rule-2);box-shadow:0 30px 80px -30px rgba(0,0,0,.6);
  }
  .sheet header{display:flex;gap:12px;align-items:flex-start;padding:20px 22px 14px;border-bottom:1px solid var(--rule)}
  .sheet .body{padding:20px 22px 22px}
  .sheet h4{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--teal);margin:18px 0 7px}
  .sheet h4:first-child{margin-top:0}
  .sheet ul{margin:0;padding-left:18px}
  .sheet li{margin-bottom:5px}
  .sheet footer{display:flex;gap:9px;flex-wrap:wrap;padding:0 22px 20px}
  .x{border:0;background:transparent;color:var(--mute);font-size:20px;line-height:1;margin-left:auto;padding:2px 6px}

  .field{display:block;margin-bottom:14px}
  .field .label{display:block;margin-bottom:5px}
  .field select,.field textarea,.field input{
    width:100%;font:inherit;color:var(--ink);background:var(--surface-2);
    border:1px solid var(--rule-2);border-radius:8px;padding:9px 11px;
  }
  .field textarea{min-height:80px;resize:vertical}

  .footnote{margin-top:26px;color:var(--mute);font-size:11.5px;text-align:center}
  .cols-3{grid-template-columns:repeat(3,1fr)}
  .cols-2{grid-template-columns:1.55fr 1fr}
  .cols-25{grid-template-columns:1fr 1fr}
  @media (max-width:940px){.cols-3,.cols-2,.cols-25{grid-template-columns:1fr}}
  /* ---------- v2: dati reali ---------- */
  .src{
    font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--mute);border:1px solid var(--rule);border-radius:4px;padding:2px 6px;white-space:nowrap;
  }
  a.link{color:var(--teal);text-decoration:underline;text-underline-offset:2px;font-weight:600}
  a.link:hover{color:var(--teal-deep)}
  .evid{font-size:11.5px;color:var(--mute);display:block;margin-top:2px}
  .sys{border:1px solid var(--rule);border-radius:9px;padding:14px;background:var(--surface-2)}
  .sys h4{font-size:13.5px;font-weight:700;margin-bottom:2px}
  .sys ul{margin:9px 0 0;padding-left:16px;font-size:12.5px;color:var(--ink-2)}
  .sys li{margin-bottom:3px}
  .figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:9px;overflow:hidden}
  .fig{background:var(--surface);padding:12px 14px}
  .fig b{display:block;font-family:"Fraunces",serif;font-size:21px;font-weight:600;letter-spacing:-.01em}
  .fig span{font-size:11.5px;color:var(--mute)}
  .owner{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
  .warn{background:var(--coral-soft);border-left:2px solid var(--coral);padding:10px 12px;border-radius:0 8px 8px 0;font-size:12.5px}

  /* ---------- v4: barra clienti e report di progetto ---------- */
  .clientbar{
    max-width:1280px;margin:0 auto;padding:0 22px 11px;
    display:flex;gap:7px;align-items:center;flex-wrap:wrap;
  }
  .clientbar .lbl{margin-right:4px}
  .cbtn{
    display:inline-flex;align-items:center;gap:7px;
    border:1px solid var(--rule-2);background:var(--surface);border-radius:99px;
    padding:5px 13px 5px 9px;font-size:12.5px;font-weight:600;color:var(--mute);
  }
  .cbtn .ini{
    width:19px;height:19px;border-radius:50%;background:var(--bg-sunk);color:var(--mute);
    display:grid;place-items:center;font-size:9.5px;font-weight:700;flex:none;
  }
  .cbtn:hover{border-color:var(--ink);color:var(--ink)}
  .cbtn[aria-current="true"]{background:var(--teal-deep);border-color:var(--teal-deep);color:var(--on-teal)}
  .cbtn[aria-current="true"] .ini{background:rgba(255,255,255,.22);color:var(--on-teal)}
  .cbtn .flag{width:6px;height:6px;border-radius:50%;background:var(--coral)}

  .rep h4{
    font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--teal);margin:22px 0 9px;
    padding-bottom:5px;border-bottom:1px solid var(--rule);
  }
  .rep h4:first-child{margin-top:0}
  .rep p{margin:0 0 9px;font-size:13px}
  .rep .line{display:flex;gap:10px;font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--rule)}
  .rep .line:last-child{border-bottom:0}
  .rep .line .w{flex:none;width:88px;color:var(--mute);font-family:"IBM Plex Mono",monospace;font-size:11px}

  @media print{
    .topbar,.footnote,.tl-actions,.x,.sheet footer{display:none!important}
    .overlay{position:static;background:none;padding:0;display:block;overflow:visible}
    .sheet{box-shadow:none;border:0;max-width:none;border-radius:0}
    .sheet header{padding:0 0 14px}
    .sheet .body{padding:0}
    #view > *:not(.overlay){display:none!important}
    body{background:#fff;color:#111}
    a.link{color:#111}
  }
</style>


</head>
<body>
<header class="topbar">
  <div class="row">
    <div class="mark">
      <div class="glyph">B</div>
      <div><b>BraveVET Journey</b><br><span id="ctxLabel">Console BraveVETBusiness</span></div>

</header>

<div class="shell">

</div>

function track(c){
  return `<div class="track">${c.steps.map((s,i)=>{
    const cls = s.st === "done" ? "done" : s.st === "now" ? "now" : "";
    return `<div class="step ${cls}">
      <div class="bead">${s.st === "done" ? "✓" : i+1}</div>
      <span class="nm">${esc(s.l)}</span>
      <span class="st">${esc(s.s)}</span>
    </div>`;
  }).join("")}</div>`;
}

function tasks(c, chi){
  return az(c, chi).map(a=>`
    <div class="task ${a.stato==="ok"?"ok":a.stato==="late"?"late":""}">
      <div class="box">${a.stato==="ok"?"✓":""}</div>
      <div style="flex:1">
        <span class="txt">${esc(a.t)}</span>
        ${a.nota?`<span class="evid">${esc(a.nota)}</span>`:""}
        <span class="evid">
          ${a.link?`<a class="link" href="${a.link}" target="_blank" rel="noopener">${esc(a.src)} — vai al minuto</a>`:esc(a.src)}
          ${a.stato==="late"?` · <b style="color:var(--coral)">in ritardo</b>`:a.stato==="wip"?" · in corso":""}
        </span>
      </div>
    </div>`).join("");
}

function sistemi(c){

}

/* ═══════════════════ render ═══════════════════ */
function render(){
  const isPortal = mode === "portal";
  $("#searchWrap").style.visibility = isPortal ? "hidden" : "visible";
  $("#ctxLabel").textContent = isPortal ? "Vista di " + current.nome
    : mode === "backoffice" ? "Back office" : "Console BraveVETBusiness";
  $("#tabConsole").setAttribute("aria-pressed", String(mode === "console" || mode === "client"));
  $("#tabPortal").setAttribute("aria-pressed", String(isPortal));
  $("#tabBack").setAttribute("aria-pressed", String(mode === "backoffice"));
  $("#tabPortal").textContent = mode === "console" ? "Lato cliente" : "Vista " + current.breve;

  const bar = $("#clientBar");
  if(mode === "console"){
    bar.hidden = true; bar.innerHTML = "";
  } else {
    bar.hidden = false;
    bar.innerHTML = `<span class="label lbl">Clienti</span>` + CLIENTS.map(c=>`
      <button class="cbtn" data-switch="${c.id}" aria-current="${c.id===current.id}">
        <span class="ini">${esc(c.breve[0])}${esc(c.nome.split(" ").slice(-1)[0][0])}</span>
        ${esc(c.nome)}${late(c)?`<span class="flag" title="azioni in ritardo"></span>`:""}
      </button>`).join("")
      + `<button class="cbtn" data-back="1" style="margin-left:auto">← Portafoglio</button>`;
  }

  const main = mode === "console" ? viewConsole()
             : mode === "client" ? viewClient()
             : mode === "portal" ? viewPortal()
             : viewBack();
  view.innerHTML = main + (sheet === "report" ? reportSheet() : sheet ? sheetForm(sheet) : "");
  window.scrollTo({top:0, behavior:"instant"});
}

function toast(msg){
  const el = document.createElement("div");
  el.textContent = msg;
  el.style.cssText = "position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:99;"
    + "background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:9px;font-size:13px;"
    + "font-weight:600;max-width:min(92vw,520px);box-shadow:0 12px 34px -14px rgba(0,0,0,.6)";
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2600);
}

document.addEventListener("click", e=>{
  const t = e.target.closest("[data-open],[data-switch],[data-back],[data-print],[data-report],[data-form],[data-goportal],[data-close],[data-toast]");
  if(!t) return;
  if(t.dataset.switch){
    const found = CLIENTS.find(c=>c.id===t.dataset.switch);
    if(found) current = found;
    if(mode !== "portal") mode = "client";
    sheet = null; render(); return;
  }
  if(t.dataset.back){ mode="console"; sheet=null; render(); return; }
  if(t.dataset.print){ window.print(); return; }
  if(t.dataset.report){ sheet="report"; render(); return; }
  if(t.dataset.open){
    const found = CLIENTS.find(c=>c.id===t.dataset.open);
    if(found) current = found;
    mode="client"; sheet=null; render(); return;
  }
  if(t.dataset.goportal){ mode="portal"; sheet=null; render(); return; }
  if(t.dataset.form){ sheet=t.dataset.form; render(); return; }
  if(t.dataset.toast){ toast(t.dataset.toast); }
  if(t.dataset.close === "1" && (e.target===t || t.classList.contains("x") || t.classList.contains("btn"))){ sheet=null; render(); }
});

$("#tabConsole").onclick = ()=>{ mode="console"; sheet=null; render(); };
$("#tabPortal").onclick  = ()=>{ mode="portal"; sheet=null; render(); };
$("#tabBack").onclick    = ()=>{ mode="backoffice"; sheet=null; render(); };

const q = $("#q"), results = $("#results");
const matches = v => {
  v = v.trim().toLowerCase();
  return v ? CLIENTS.filter(c => (c.nome + " " + c.ruolo).toLowerCase().includes(v)) : [];
};
function drawResults(){
  const list = matches(q.value);
  results.hidden = !list.length;
  results.innerHTML = list.map((c,i)=>`<button data-open="${c.id}" class="${i===0?"on":""}">
      <span class="nm">${esc(c.nome)}</span>
      <span class="meta">${esc(c.avanzamento)}</span></button>`).join("");
}
q.addEventListener("input", drawResults);
q.addEventListener("keydown", e=>{
  if(e.key==="Enter"){
    const first = matches(q.value)[0];
    if(first){ current=first; mode="client"; sheet=null; q.value=""; results.hidden=true; render(); }
  }
  if(e.key==="Escape"){ q.value=""; results.hidden=true; }
});
document.addEventListener("click", e=>{ if(!e.target.closest("#searchWrap")) results.hidden = true; });
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && sheet){ sheet=null; render(); } });

render();

</script>
</body>
</html>
